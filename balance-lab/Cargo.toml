[package]
name = "epoch-balance-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "epoch_core"
path = "src/lib.rs"

[[bin]]
name = "epoch-lab"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

