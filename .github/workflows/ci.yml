name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt
          rustup override set 1.96.1

      - name: Check JavaScript syntax
        run: node --check sim.js && node --check qa.js && node --check endless.js && node --check screenshot.js && node --check oracle.js && node --check balance-lab/golden/generate.js && node --check balance-lab/apply-params.js && node --check balance-lab/check-report.js && node --check balance-lab/check-defender.js && node --check balance-lab/capture-playtraces.js && node --check balance-lab/inspect-dashboard.js

      - name: Check Rust balance lab formatting
        run: cargo fmt --manifest-path balance-lab/Cargo.toml --all -- --check

      - name: Check Rust balance core and full oracle contract
        run: cargo test --manifest-path balance-lab/Cargo.toml --locked && npm run lab:oracle-full && npm run lab:policy-golden

      - name: Verify balance and browser behavior
        run: npm test

      - name: Verify distributional search gates
        run: npm run lab:search-gates && npm run lab:defender-gates

      - name: Reject tracked-output drift
        run: git diff --exit-code
